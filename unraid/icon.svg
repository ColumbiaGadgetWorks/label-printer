<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- label feeding out of the top of a desktop thermal printer -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#1f242c"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5565"/>
      <stop offset="1" stop-color="#353c48"/>
    </linearGradient>
  </defs>

  <!-- label -->
  <g>
    <rect x="132" y="28" width="248" height="300" rx="14" fill="#ffffff" stroke="#d6dbe3" stroke-width="4"/>
    <!-- barcode -->
    <g fill="#111">
      <rect x="160" y="62" width="8"  height="118"/>
      <rect x="174" y="62" width="4"  height="118"/>
      <rect x="184" y="62" width="12" height="118"/>
      <rect x="202" y="62" width="4"  height="118"/>
      <rect x="212" y="62" width="8"  height="118"/>
      <rect x="226" y="62" width="4"  height="118"/>
      <rect x="236" y="62" width="12" height="118"/>
      <rect x="254" y="62" width="8"  height="118"/>
      <rect x="268" y="62" width="4"  height="118"/>
      <rect x="278" y="62" width="12" height="118"/>
      <rect x="296" y="62" width="4"  height="118"/>
      <rect x="306" y="62" width="8"  height="118"/>
      <rect x="320" y="62" width="4"  height="118"/>
      <rect x="330" y="62" width="8"  height="118"/>
      <rect x="344" y="62" width="8"  height="118"/>
    </g>
    <!-- text lines -->
    <rect x="160" y="200" width="150" height="16" rx="4" fill="#111"/>
    <rect x="160" y="228" width="192" height="12" rx="4" fill="#9aa3af"/>
    <rect x="160" y="250" width="120" height="12" rx="4" fill="#9aa3af"/>
  </g>

  <!-- printer -->
  <path d="M60 300 Q60 268 92 268 H420 Q452 268 452 300 V440 Q452 476 416 476 H96 Q60 476 60 440 Z" fill="url(#body)"/>
  <path d="M60 300 Q60 268 92 268 H420 Q452 268 452 300 V330 H60 Z" fill="url(#lid)"/>
  <!-- exit slot, label emerges from it -->
  <rect x="112" y="282" width="288" height="18" rx="9" fill="#0e1116"/>
  <rect x="132" y="250" width="248" height="42" fill="#ffffff"/>
  <rect x="132" y="286" width="248" height="6" fill="#0e1116" opacity=".35"/>
  <!-- status light + button -->
  <circle cx="392" cy="412" r="14" fill="#22c55e"/>
  <circle cx="392" cy="412" r="22" fill="none" stroke="#22c55e" stroke-opacity=".35" stroke-width="6"/>
  <rect x="104" y="398" width="96" height="28" rx="14" fill="#2563eb"/>
</svg>
