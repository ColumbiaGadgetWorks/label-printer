server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript text/html;
    gzip_min_length 512;

    # pdf.js is an ES module and must be served as JavaScript
    location ~ \.mjs$ { types { } default_type text/javascript; }
    location ~ \.wasm$ { types { } default_type application/wasm; }

    # tiny app on a LAN: never serve a stale UI after an update
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
